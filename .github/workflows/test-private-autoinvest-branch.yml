name: AutoInvest private source tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-private-autoinvest-branch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test private AutoInvest branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private AutoInvest test branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alecano98/autoinvest
          ref: feat/adaptive-paper-deployment-budget
          token: ${{ secrets.AUTOINVEST_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        working-directory: source
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run complete test suite
        working-directory: source
        env:
          PYTHONPATH: "."
        run: |
          python -m pytest -q
